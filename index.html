<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Тест | Рабочая версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 30px;
        }
        
        .question {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3748;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .option {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .option:hover {
            border-color: #4299e1;
            transform: translateY(-2px);
        }
        
        .option.selected {
            border-color: #4299e1;
            background: #ebf8ff;
        }
        
        .option-code {
            font-weight: bold;
            color: #2b6cb0;
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        
        .btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: #718096;
        }
        
        .hidden {
            display: none !important;
        }
        
        .result-badge {
            font-size: 3em;
            font-weight: 800;
            color: #2b6cb0;
            text-align: center;
            margin: 20px 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: #4299e1;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .type {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .stat-card .count {
            font-size: 2em;
            font-weight: 800;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            text-align: center;
        }
        
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.error {
            background: #fed7d7;
            color: #742a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Тест на тип личности</h1>
        
        <!-- Статус (для отладки) -->
        <div id="status" class="status hidden"></div>
        
        <!-- Экран теста -->
        <div id="testScreen">
            <div id="questions"></div>
            <div style="text-align: center;">
                <button class="btn" id="submitBtn" disabled>Узнать результат</button>
                <button class="btn secondary" id="adminBtn">📊 Админ</button>
            </div>
        </div>
        
        <!-- Экран результата -->
        <div id="resultScreen" class="hidden">
            <div class="result-badge" id="resultType"></div>
            <div style="text-align: center;">
                <button class="btn" id="restartBtn">Пройти заново</button>
                <button class="btn secondary" id="resultAdminBtn">📊 Админ</button>
            </div>
        </div>
        
        <!-- Экран админа -->
        <div id="adminScreen" class="hidden">
            <h2>Статистика</h2>
            <div style="margin-bottom: 20px;">
                <input type="password" id="password" placeholder="Пароль" style="padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; margin-right: 10px;">
                <button class="btn" id="loginBtn">Войти</button>
            </div>
            
            <div id="adminContent" class="hidden">
                <div id="statsGrid" class="stats-grid"></div>
                <button class="btn secondary" id="backBtn">← Назад</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ВСТАВЬТЕ ВАШУ ССЫЛКУ СЮДА
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymC42i9j04WalTbmoDJjBLu84TgUXoNeiSHwHwp7n-Mg8pooQcj1qZD_gF0Mc94-FGjA/exec';
        const ADMIN_PASSWORD = '123';

        // Вопросы (упрощенные для теста)
        const questions = [
            { text: "1. После работы вы:", left: "E", right: "I" },
            { text: "2. В решениях вы:", left: "T", right: "F" },
            { text: "3. В планировании:", left: "J", right: "P" },
            { text: "4. Восприятие мира:", left: "S", right: "N" }
        ];

        let answers = new Array(4).fill(null);
        let currentType = '';

        // Показать статус
        function showStatus(text, isError = false) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status ' + (isError ? 'error' : 'success');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
        }

        // Отрисовка вопросов
        function renderQuestions() {
            let html = '';
            questions.forEach((q, i) => {
                html += `
                    <div class="question">
                        <div class="question-text">${q.text}</div>
                        <div class="options">
                            <div class="option ${answers[i] === 'left' ? 'selected' : ''}" onclick="select(${i}, 'left')">
                                <div class="option-code">${q.left}</div>
                            </div>
                            <div class="option ${answers[i] === 'right' ? 'selected' : ''}" onclick="select(${i}, 'right')">
                                <div class="option-code">${q.right}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('questions').innerHTML = html;
            document.getElementById('submitBtn').disabled = answers.includes(null);
        }

        window.select = (i, val) => {
            answers[i] = val;
            renderQuestions();
        };

        // ===== РАБОТА С GOOGLE SHEETS ЧЕРЕЗ JSONP =====
        function saveToGoogle(type) {
            showStatus('⏳ Сохраняем результат...');
            
            // Создаем уникальное имя callback функции
            const callbackName = 'callback_' + Date.now();
            
            // Создаем скрипт для JSONP запроса
            const script = document.createElement('script');
            
            // Обработчик ответа
            window[callbackName] = function(response) {
                console.log('Ответ от Google:', response);
                showStatus('✅ Результат сохранен в Google Sheets!');
                delete window[callbackName];
                document.body.removeChild(script);
            };
            
            // Формируем URL с параметрами
            script.src = SCRIPT_URL + '?type=' + encodeURIComponent(type) + '&callback=' + callbackName;
            
            // Обработка ошибок
            script.onerror = function() {
                showStatus('⚠️ Результат сохранен локально (нет связи с Google)', true);
                delete window[callbackName];
                document.body.removeChild(script);
            };
            
            document.body.appendChild(script);
            
            // Таймаут на случай если ответ не пришел
            setTimeout(() => {
                if (window[callbackName]) {
                    showStatus('⚠️ Таймаут, но результат показан', true);
                    delete window[callbackName];
                    document.body.removeChild(script);
                }
            }, 5000);
        }

        function loadStats(callback) {
            showStatus('⏳ Загружаем статистику...');
            
            const callbackName = 'stats_' + Date.now();
            
            window[callbackName] = function(data) {
                console.log('Статистика загружена:', data);
                showStatus('✅ Статистика загружена');
                callback(data);
                delete window[callbackName];
                document.body.removeChild(script);
            };
            
            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?callback=' + callbackName;
            
            script.onerror = function() {
                showStatus('⚠️ Не удалось загрузить статистику', true);
                callback({});
                delete window[callbackName];
                document.body.removeChild(script);
            };
            
            document.body.appendChild(script);
            
            setTimeout(() => {
                if (window[callbackName]) {
                    showStatus('⚠️ Таймаут загрузки статистики', true);
                    callback({});
                    delete window[callbackName];
                    document.body.removeChild(script);
                }
            }, 5000);
        }

        // Расчет типа
        function calculateType() {
            let counts = {E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0};
            answers.forEach((a, i) => {
                if (a === 'left') counts[questions[i].left]++;
                else counts[questions[i].right]++;
            });
            return (counts.E > counts.I ? 'E' : 'I') +
                   (counts.S > counts.N ? 'S' : 'N') +
                   (counts.T > counts.F ? 'T' : 'F') +
                   (counts.J > counts.P ? 'J' : 'P');
        }

        // Навигация
        function showTest() {
            document.getElementById('testScreen').classList.remove('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('adminScreen').classList.add('hidden');
        }

        function showResult() {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('adminScreen').classList.add('hidden');
        }

        function showAdmin() {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('adminScreen').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('password').value = '';
        }

        // Обработчики
        document.getElementById('submitBtn').onclick = () => {
            currentType = calculateType();
            document.getElementById('resultType').innerText = currentType;
            saveToGoogle(currentType);
            showResult();
        };

        document.getElementById('restartBtn').onclick = () => {
            answers = new Array(4).fill(null);
            renderQuestions();
            showTest();
        };

        document.getElementById('adminBtn').onclick = showAdmin;
        document.getElementById('resultAdminBtn').onclick = showAdmin;

        document.getElementById('backBtn').onclick = () => {
            if (currentType) showResult();
            else showTest();
        };

        document.getElementById('loginBtn').onclick = () => {
            if (document.getElementById('password').value === ADMIN_PASSWORD) {
                loadStats((stats) => {
                    let html = '';
                    for (let type in stats) {
                        html += `
                            <div class="stat-card">
                                <div class="type">${type}</div>
                                <div class="count">${stats[type]}</div>
                            </div>
                        `;
                    }
                    document.getElementById('statsGrid').innerHTML = html || '<p>Пока нет данных</p>';
                    document.getElementById('adminContent').classList.remove('hidden');
                });
            } else {
                showStatus('❌ Неверный пароль', true);
            }
        };

        renderQuestions();
    </script>
</body>
</html>
