<!DOCTYPE html>
<html>
<head>
    <title>MBTI Тест</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-top: 0;
        }
        .question {
            margin-bottom: 25px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 12px;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
            color: #2d3748;
        }
        .options {
            display: flex;
            gap: 10px;
        }
        .option {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .option.selected {
            border-color: #4299e1;
            background: #ebf8ff;
        }
        .btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 5px 0;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn.secondary {
            background: #718096;
        }
        .hidden {
            display: none;
        }
        .result {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #4299e1;
            margin: 20px 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .stat-item {
            background: #4299e1;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-item .type {
            font-size: 20px;
            font-weight: bold;
        }
        .stat-item .count {
            font-size: 28px;
            font-weight: 800;
        }
        input {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            width: 100%;
            margin: 10px 0;
            box-sizing: border-box;
        }
        .error {
            color: #e53e3e;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1>🧠 Тип личности</h1>
        
        <!-- Экран 1: Тест -->
        <div id="testScreen">
            <div id="questions"></div>
            <button class="btn" id="submitBtn" disabled>Узнать результат</button>
            <button class="btn secondary" id="adminBtn">📊 Админ</button>
        </div>

        <!-- Экран 2: Результат -->
        <div id="resultScreen" class="hidden">
            <div class="result" id="resultType"></div>
            <button class="btn" id="againBtn">Пройти заново</button>
            <button class="btn secondary" id="adminFromResult">📊 Админ</button>
        </div>

        <!-- Экран 3: Админ -->
        <div id="adminScreen" class="hidden">
            <h2>Вход</h2>
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn" id="loginBtn">Войти</button>
            <div id="adminStats" class="hidden">
                <h2>Статистика</h2>
                <div id="stats" class="stats-grid"></div>
                <button class="btn secondary" id="backBtn">Назад</button>
            </div>
            <div id="adminError" class="error hidden">Неверный пароль</div>
        </div>
    </div>

    <script>
        // ⚠️ ВСТАВЬТЕ СВОЮ ССЫЛКУ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-tkIbf9XbC2QgLwC_zpIhI4fRgO0tC7Qmg5z1pAncqBz8Wsxx5c_6Ih7irInW_Wa-6Q/exec';
        const ADMIN_PASSWORD = '123';

        // Вопросы
        const questions = [
            { text: "После работы вы:", left: "E", right: "I" },
            { text: "В решениях вы:", left: "T", right: "F" },
            { text: "В планировании:", left: "J", right: "P" },
            { text: "Восприятие мира:", left: "S", right: "N" },
            { text: "В компании вы:", left: "E", right: "I" },
            { text: "Принимая решения:", left: "T", right: "F" },
            { text: "Ваш стиль:", left: "J", right: "P" },
            { text: "Доверяете:", left: "S", right: "N" }
        ];

        let answers = new Array(8).fill(null);
        let currentType = '';

        // Отрисовка вопросов
        function renderQuestions() {
            let html = '';
            questions.forEach((q, i) => {
                html += `<div class="question">
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        <div class="option ${answers[i] === 'left' ? 'selected' : ''}" onclick="select(${i}, 'left')">${q.left}</div>
                        <div class="option ${answers[i] === 'right' ? 'selected' : ''}" onclick="select(${i}, 'right')">${q.right}</div>
                    </div>
                </div>`;
            });
            document.getElementById('questions').innerHTML = html;
            document.getElementById('submitBtn').disabled = answers.includes(null);
        }

        window.select = (i, val) => {
            answers[i] = val;
            renderQuestions();
        };

        // Сохранение в Google
        async function saveToGoogle(type) {
            try {
                await fetch(SCRIPT_URL + '?type=' + type);
                console.log('Сохранено');
            } catch (e) {
                console.log('Ошибка сохранения');
            }
        }

        // Загрузка статистики
        async function loadStats() {
            try {
                let res = await fetch(SCRIPT_URL);
                return await res.json();
            } catch (e) {
                return {};
            }
        }

        // Расчет типа
        function calculateType() {
            let counts = {E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0};
            answers.forEach((a, i) => {
                if (a === 'left') counts[questions[i].left]++;
                else counts[questions[i].right]++;
            });
            return (counts.E > counts.I ? 'E' : 'I') +
                   (counts.S > counts.N ? 'S' : 'N') +
                   (counts.T > counts.F ? 'T' : 'F') +
                   (counts.J > counts.P ? 'J' : 'P');
        }

        // Навигация
        function showTest() {
            document.getElementById('testScreen').style.display = 'block';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'none';
        }

        function showResult() {
            document.getElementById('testScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('adminScreen').style.display = 'none';
        }

        function showAdmin() {
            document.getElementById('testScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
            document.getElementById('adminStats').style.display = 'none';
            document.getElementById('password').value = '';
        }

        // События
        document.getElementById('submitBtn').onclick = async () => {
            currentType = calculateType();
            document.getElementById('resultType').innerText = currentType;
            await saveToGoogle(currentType);
            showResult();
        };

        document.getElementById('againBtn').onclick = () => {
            answers = new Array(8).fill(null);
            renderQuestions();
            showTest();
        };

        document.getElementById('adminBtn').onclick = showAdmin;
        document.getElementById('adminFromResult').onclick = showAdmin;

        document.getElementById('backBtn').onclick = () => {
            if (currentType) showResult();
            else showTest();
        };

        document.getElementById('loginBtn').onclick = async () => {
            if (document.getElementById('password').value === ADMIN_PASSWORD) {
                let stats = await loadStats();
                let html = '';
                for (let type in stats) {
                    html += `<div class="stat-item">
                        <div class="type">${type}</div>
                        <div class="count">${stats[type]}</div>
                    </div>`;
                }
                document.getElementById('stats').innerHTML = html;
                document.getElementById('adminStats').style.display = 'block';
                document.getElementById('adminError').style.display = 'none';
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        };

        renderQuestions();
    </script>
</body>
</html>
